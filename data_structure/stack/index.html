  <script>
    class Stack {
      constructor () {
        this.items = [];
      }
      push(node) {
        this.items.push(node);
      }
      pop() {
       return this.items.pop();
      }

      peek() {
        return this.items[this.items.length - 1]
      }

      isEmpty() {
        return this.items.length === 0
      }

      clear() {
        this.items = []
      }
    }

    // 利用对象实现栈
    class StackObject {
      constructor() {
        this._i = Symbol('Stack')
        this[this._i] = {}
        this.length = 0
      }
      push(node) {
        this[this._i][this.length] = node;
        this.length++
      }
      pop() {
        if (this.isEmpty()) {
          return null;
        }
        this.length--
        const r = this[this._i][this.length]
        delete this[this._i][this.length]
        return r
      }
      getItems() {
        return this[this._i]
      }
      // 获取栈顶节点
      peek() {
        if (this.isEmpty()) {
          return null
        }
        return this[this._i][this.length - 1]
      }
      isEmpty() {
        return this.length === 0
      }
      clear() {
        this[this._i] = {}
        this.length = 0
      }
    }

    /***
     * @desc 通用，10进制转其他进制
     * @param {number} number 10进制数字
     * @param {number} bs 2进制，8进制，16进制
     * @return {string} 转换结果 
     **/
    function converter(number, bs) {
      const stack = new StackObject();
      const digits = '0123456789ABCDEF';
      let result = '';

      while(number > 0) {
        stack.push(number % bs);
        number = Math.floor(number / bs);
      }

      console.log(stack);

      while (!stack.isEmpty()) {
        result += digits[stack.pop()];
      }

      return result
    }
    console.log(converter(8, 2));

    // 匹配括号是有有效 
    function isValid(s) {
      const stack = new Stack()

      for (var i = 0; i < s.length; i++) {
        // 当前字符
        const c = s[i]  

        // 栈顶字符
        const p = stack.peek()
        if (c == ')' && p == '(' || c == ']' && p == '[' || c == '}' && p == '{') {
          // 匹配上了，p 出栈，否则，c 入栈
          stack.pop()
        } else {
          stack.push(c)
        }
      }

      // 最后，如果栈为空，则表示完全匹配，否则表示没有完全正确匹配
      return stack.isEmpty()
    }

    console.log(isValid('()'))    // true
    console.log(isValid('()[]{}'))  // true
    console.log(isValid('(]'))  // false
    console.log(isValid('([)]'))  // false
    console.log(isValid('{[]}'))  // true
  </script>
